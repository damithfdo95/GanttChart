name = "testrail-proxy"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[vars]
# The TestRail instance the worker forwards to (hosted cloud base URL, no trailing slash).
TESTRAIL_ORIGIN = "https://rkong.testrail.com"
# The origin allowed to call this proxy (CORS). Falls back to the built-in
# default when unset; set it here when the app is served from a new address.
# APP_ORIGIN = "https://ganttchart.damithfdo.workers.dev"
