name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A newer push to the same ref supersedes an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck (strict indexed access)
        run: npm run typecheck:strict

      - name: Lint
        run: npm run lint

      # Includes the TestRail/JIRA client contract tests, the proxy tests and the security/config baseline tests.
      - name: Unit tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  worker:
    name: Worker (typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Core tests (Node + sql.js)
        run: npm run test:core

      - name: Workers runtime tests
        run: npm run test:workers

      - name: Production-config simulation tests
        run: npm run test:prod-sim
