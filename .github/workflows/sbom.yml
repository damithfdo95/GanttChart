name: SBOM

# Manual: produces a CycloneDX software bill of materials for the production dependencies and keeps it as a build artifact.
# The same command works locally: npm run sbom

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci

      - run: npm run sbom

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
