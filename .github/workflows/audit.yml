name: Dependency audit

# Weekly and on demand. Production dependencies must be free of High/Critical advisories (blocking).
# Development tooling is also blocking because it runs against repository
# content and secrets in developer/CI environments.

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Root production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Worker production dependencies (blocking)
        working-directory: worker
        run: npm audit --omit=dev --audit-level=high

      - name: Full audit incl. dev tooling
        run: npm audit --audit-level=high

      - name: Full Worker audit incl. dev tooling
        working-directory: worker
        run: npm audit --audit-level=high
